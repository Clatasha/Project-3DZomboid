name: Publish v0.1.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.1.1.yml'
      - 'release-package/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v0.1.1
  cancel-in-progress: false
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and behavior
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/Setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax check failed' }
          & ./Setup.ps1 -SelfTest
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify tested package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, json
          path=Path('PZ-3D-Setup-v0.1.1.zip')
          parts=sorted(Path('release-package').glob('package.part-*'))
          assert len(parts)==40
          with path.open('wb') as output:
              for part in parts: output.write(part.read_bytes())
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest=='aa74f59a3edfc14efa4a2a6025dfb393585abb24b7ccd192bdfdaf0b5dbd0edf'
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              assert archive.read('PZ-3D-Setup/Setup.ps1')==Path('Setup.ps1').read_bytes()
              for item in json.loads(archive.read('PZ-3D-Setup/payload-hashes.json')):
                  assert hashlib.sha256(archive.read('PZ-3D-Setup/'+item['path'])).hexdigest().upper()==item['hash']
          Path('SHA256SUMS.txt').write_text(digest+'  '+path.name+'\n')
          PY
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.1 PZ-3D-Setup-v0.1.1.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.1.1 PZ-3D-Setup-v0.1.1.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Project 3DZomboid v0.1.1 | Public Testing Release" --notes-file RELEASE-NOTES.md
          fi
